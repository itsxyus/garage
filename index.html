<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Clifford Build Log</title>
<style>
:root{--accent:#ff3b3b;
  --bg:#050608;
  --panel:#111319;
  --line:rgba(255,255,255,.11);
  --text:#f6f6f6;
  --muted:#a3a6ad;
  --red:var(--accent,#ff3b3b);
  --red-dark:#8f1616;
  --green:#54db8d;
  --yellow:#ffcc4d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  margin:0;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 85% 5%,rgba(255,59,59,.14),transparent 30%),
    radial-gradient(circle at 8% 0%,rgba(255,255,255,.06),transparent 26%),
    linear-gradient(145deg,#030405,#090b10 52%,#100707);
  min-height:100vh;
  padding-bottom:96px;
}
.app{
  width:min(1120px,100%);
  margin:0 auto;
  padding:22px 18px 28px;
}
.hero{
  display:grid;
  grid-template-columns:1fr auto;
  gap:18px;
  align-items:stretch;
  margin-bottom:18px;
}
.car-card{
  display:flex;
  gap:18px;
  align-items:center;
  min-width:0;
  overflow:visible;
}
.car-img{
  cursor:pointer;
  object-fit:contain;
  image-rendering:auto;
  
  
  object-fit:cover;
  
  
  
  
  flex:0 0 auto;

  width:260px;
  height:145px;
  border-radius:0;
  background:transparent;
  border:0;
  box-shadow:none;}
.title{min-width:0}
.title h1{
  margin:0;
  font-size:clamp(2.3rem,7vw,4rem);
  letter-spacing:-.06em;
  line-height:.95;
  overflow-wrap:anywhere;
}
.model{
  color:var(--red);
  font-size:clamp(1.05rem,3.8vw,1.65rem);
  margin-top:10px;
  font-weight:700;
}
.tags{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tag{
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  border-radius:10px;
  padding:7px 12px;
  font-weight:800;
}
.total-card{
  min-width:235px;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(17,19,25,.72);
  backdrop-filter:blur(18px);
  padding:18px 20px;
  box-shadow:0 18px 45px rgba(0,0,0,.28);
}
.total-card small{display:block;color:var(--muted);font-size:1rem;font-weight:700}
.total-card strong{
  display:block;
  color:var(--red);
  font-size:2rem;
  margin:8px 0 12px;
  letter-spacing:-.04em;
}
.money-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  color:#d9d9d9;
  border-top:1px solid rgba(255,255,255,.08);
  padding-top:8px;
  line-height:1.6;
}
.owned-card{
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(135deg,rgba(255,59,59,.13),rgba(255,255,255,.035));
  padding:15px 18px;
  margin:16px 0 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.owned-card span{color:var(--muted);font-weight:800}
.owned-card b{font-size:1.05rem;color:#fff;text-align:right}
.stage{
  position:relative;
  min-height:420px;
}
.page{
  display:none;
  opacity:0;
  transform:scale(.965) translateY(14px);
  filter:blur(4px);
}
.page.active{
  display:block;
  animation:pageIn .26s cubic-bezier(.2,.75,.25,1) forwards;
}
.page.leaving{
  display:block;
  position:absolute;
  inset:0;
  pointer-events:none;
  animation:pageOut .22s cubic-bezier(.2,.75,.25,1) forwards;
}
@keyframes pageIn{
  from{opacity:0;transform:scale(.965) translateY(14px);filter:blur(4px)}
  to{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}
}
@keyframes pageOut{
  from{opacity:1;transform:scale(1) translateY(0);filter:blur(0)}
  to{opacity:0;transform:scale(.94) translateY(-10px);filter:blur(5px)}
}
.section{
  border:1px solid var(--line);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(18,20,27,.86),rgba(10,12,17,.78));
  box-shadow:0 18px 44px rgba(0,0,0,.32);
  padding:20px;
  margin:18px 0;
  overflow:hidden;
}
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding-bottom:14px;
  border-bottom:1px solid rgba(255,255,255,.1);
}
.section-controls{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.sort-select{
  width:auto;
  min-width:150px;
  margin-top:0;
  padding:9px 10px;
  border-radius:13px;
  font-size:.86rem;
  font-weight:800;
}
.planned-line{
  color:var(--muted);
  font-size:.86rem;
  font-weight:800;
  margin-top:-6px;
  margin-bottom:10px;
}
.planned-line b{color:var(--yellow)}
.section h2{
  margin:0;
  font-size:clamp(1.55rem,4vw,2.55rem);
  letter-spacing:-.05em;
}
.btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:var(--text);
  border-radius:15px;
  padding:11px 15px;
  font-weight:900;
  font-size:.95rem;
  cursor:pointer;
}
.btn.red{
  background:linear-gradient(135deg,rgba(255,59,59,.9),rgba(130,18,18,.9));
  border-color:rgba(255,95,95,.7);
}
.btn.danger{background:#301014;color:#ffd0d0;border-color:#6f252b}
.swipe-wrap{
  position:relative;
  overflow:hidden;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.swipe-wrap:last-child{border-bottom:none}
.delete-bg{
  position:absolute;
  inset:0 0 0 auto;
  width:112px;
  background:linear-gradient(135deg,#5a1016,#c92c34);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:950;
  letter-spacing:.02em;
  opacity:0;
  transform:translateX(18px);
  transition:opacity .18s ease, transform .18s ease;
  pointer-events:none;
}
.swipe-wrap.show-delete .delete-bg{
  opacity:1;
  transform:translateX(0);
  pointer-events:auto;
}
.item,.service-item{
  position:relative;
  background:transparent;
  transition:transform .22s ease, background .18s ease;
  touch-action:pan-y;
}
.item{
  display:grid;
  grid-template-columns:150px minmax(0,1fr) auto 24px;
  gap:22px;
  align-items:center;
  padding:16px 4px;
}
.item.swiped,.service-item.swiped{transform:translateX(-112px)}
.thumb{
  cursor:pointer;
  width:150px;
  height:96px;
  border-radius:14px;
  object-fit:cover;
  background:#0b0d11;
  border:1px solid rgba(255,255,255,.14);
}
.info{min-width:0}
.info h3{
  margin:0 0 8px;
  font-size:1.35rem;
  letter-spacing:-.03em;
  line-height:1.15;
  overflow-wrap:anywhere;
}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  color:var(--muted);
  font-weight:700;
  font-size:.86rem;
}
.pill{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.045);
  border-radius:999px;
  padding:5px 9px;
}
.price{
  color:var(--red);
  font-size:1.45rem;
  font-weight:950;
  white-space:nowrap;
}
.chev{font-size:2rem;color:#858990}
.editor{
  display:none;
  grid-column:1/-1;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.09);
  border-radius:18px;
  padding:14px;
  margin-top:-4px;
  max-width:100%;
}
.editor.open{display:block}
.form{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}
label{
  color:var(--muted);
  font-size:.75rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.05em;
  min-width:0;
}
input,select,textarea{
  width:100%;
  max-width:100%;
  margin-top:5px;
  background:#0b0e14;
  color:var(--text);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  padding:11px;
  font:inherit;
  outline:none;
}
textarea{min-height:70px;resize:vertical}
.full{grid-column:1/-1}
.span2{grid-column:span 2}
.actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:12px;
  flex-wrap:wrap;
}
.service-item{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  padding:15px 4px;
}
.service-title{
  font-size:1.2rem;
  font-weight:900;
  margin-bottom:6px;
  overflow-wrap:anywhere;
}
.service-sub{
  color:var(--muted);
  font-weight:700;
  line-height:1.5;
}
.due{
  text-align:right;
  font-weight:950;
  color:var(--red);
  white-space:nowrap;
}
.due.good{color:var(--green)}
.due.warn{color:var(--yellow)}
.due.bad{color:var(--red)}
.overview-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.mini{
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:16px;
  min-width:0;
}
.mini span{display:block;color:var(--muted);font-weight:800;margin-bottom:7px}
.mini b{font-size:1.45rem;color:var(--red)}
.timeline-entry{
  display:grid;
  grid-template-columns:15px minmax(0,1fr) auto;
  gap:12px;
  align-items:start;
  padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.timeline-entry:last-child{border-bottom:none}
.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--red);
  margin-top:7px;
  box-shadow:0 0 18px rgba(255,59,59,.55);
}
.timeline-title{font-weight:950;font-size:1.12rem}
.timeline-sub{color:var(--muted);font-weight:700;margin-top:4px;line-height:1.4}
.timeline-date{color:var(--red);font-weight:950;white-space:nowrap}
.bottom-tabs{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:10px 10px max(10px,env(safe-area-inset-bottom));
  background:rgba(10,11,15,.88);
  border-top:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(20px);
  display:flex;
  justify-content:center;
  gap:2px;
  z-index:50;
}
.tab{
  flex:1;
  max-width:190px;
  border:0;
  background:transparent;
  color:#898d95;
  padding:8px 4px 6px;
  border-radius:16px;
  font-weight:900;
  cursor:pointer;
  transition:transform .18s ease, background .18s ease, color .18s ease;
}
.tab .ico{display:block;font-size:1.55rem;line-height:1}
.tab .txt{display:block;font-size:.78rem;margin-top:3px}
.tab.active{
  color:var(--red);
  background:rgba(255,59,59,.08);
  transform:scale(1.06) translateY(-2px);
}
.hidden{display:none!important}
@media(max-width:800px){
  .section-head{align-items:flex-start}
  .section-controls{width:100%;justify-content:space-between}
  .sort-select{flex:1;min-width:120px}

  .app{padding:16px 12px 24px}
  .hero{grid-template-columns:1fr}
  .car-card{align-items:flex-start}
  .car-img{width:142px;height:84px;border-radius:17px}
  .total-card{min-width:0}
  .owned-card{align-items:flex-start;flex-direction:column}
  .owned-card b{text-align:left}
  .item{grid-template-columns:96px minmax(0,1fr) auto 16px;gap:12px}
  .thumb{width:96px;height:82px}
  .info h3{font-size:1.05rem}
  .price{font-size:1.05rem}
  .chev{font-size:1.4rem}
  .section{padding:14px;border-radius:20px}
  .form{grid-template-columns:1fr 1fr}
  .span2,.full{grid-column:1/-1}
  .overview-grid{grid-template-columns:1fr}
}
@media(max-width:430px){
  .item{grid-template-columns:82px minmax(0,1fr) auto 12px;gap:9px}
  .thumb{width:82px;height:76px}
  .meta{display:none}
  .price{font-size:.98rem}
  .btn{padding:9px 11px}
  .service-item{grid-template-columns:1fr}
  .due{text-align:left}
  .timeline-entry{grid-template-columns:12px minmax(0,1fr)}
  .timeline-date{grid-column:2}
}

/* Mobile garage polish */

.sticky-hero{
  position:sticky;
  top:calc(env(safe-area-inset-top) + 12px);
  z-index:30;
  background:linear-gradient(145deg,rgba(5,6,8,.92),rgba(10,11,15,.78));
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.09);
  border-radius:24px;
  padding:12px;
  margin-top:calc(env(safe-area-inset-top) + 8px);
  box-shadow:0 14px 35px rgba(0,0,0,.3);
}
.sticky-hero .car-img{
  width:230px;
  height:130px;
  object-fit:contain;
}
.sticky-hero .title h1{
  font-size:clamp(1.8rem,6vw,3.2rem);
}
.sticky-hero .model{
  font-size:clamp(.95rem,3vw,1.25rem);
}
.sticky-hero .total-card{
  padding:14px 16px;
  min-width:200px;
}
.sticky-hero .total-card strong{
  font-size:1.55rem;
}

.bottom-tabs{
  padding:7px 10px max(5px,calc(env(safe-area-inset-bottom) - 6px));
}
.tab{
  padding:6px 4px 4px;
}









@media(max-width:800px){
  .sticky-hero{
    top:calc(env(safe-area-inset-top) + 10px);
    margin-top:calc(env(safe-area-inset-top) + 8px);
    grid-template-columns:1fr;
  }
  .sticky-hero .car-card{
    width:100%;
  }
  .sticky-hero .car-img{
    width:170px;
    height:100px;
  }
  .sticky-hero .tags{
    display:none;
  }
  
@media(max-width:430px){
  .sticky-hero{
    padding:10px;
    border-radius:20px;
  }
  .sticky-hero .car-img{
    width:155px;
    height:94px;
  }
  .sticky-hero .title h1{
    font-size:1.75rem;
  }
  .sticky-hero .model{
    font-size:.9rem;
  }
  .sticky-hero .total-card{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 12px;
  }
  .sticky-hero .total-card small,
  .sticky-hero .total-card strong{
    grid-column:1/-1;
  }
  .sticky-hero .money-row{
    border-top:0;
    padding-top:0;
    display:block;
    font-size:.86rem;
  }
}

}

}
.model{

}
.tag{
  font-weight:500 !important;
}
.total-card small,
.money-row,
.money-row b{

}

}

.sort-select,
label,
.meta,

.timeline-sub,

}

  object-fit:contain !important;
}


/* v4.3 photo upload fix */
.mini-photo-btn{
  margin-top:10px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.045);
  color:var(--text);
  border-radius:12px;
  padding:8px 11px;
  font:inherit;
  font-weight:500;
}
.hidden{
  display:none !important;
}


/* v4.4 rebuilt photo upload system */
.real-file-input{
  position:absolute;
  width:1px;
  height:1px;
  opacity:0;
  pointer-events:none;
}
.file-btn,
.mini-photo-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:10px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.045);
  color:var(--text);
  border-radius:12px;

<div class="app">
<section class="hero sticky-hero">

  <main id="overviewPage" class="page">

  <main id="settingsPage" class="page">

          <input id="authPassword" type="password" placeholder="password">

          <button class="btn" onclick="cloudSignUp()" type="button">Sign Up</button>
        </div>

        <div class="cloud-actions">
          <button class="btn red" onclick="cloudSaveNow()" type="button">Save to Cloud</button>
          <button class="btn" onclick="cloudLoad()" type="button">Load from Cloud</button>
          <button class="btn danger" onclick="cloudSignOut()" type="button">Log Out</button>
        </div>
      </div>

      <div class="form">
        <label>Car Name<input id="settingsCarName" oninput="data.carName=this.value;save();syncSettingsToGarage();renderHero()"></label>
        <label>Year<input id="settingsCarYear" inputmode="numeric" oninput="data.carYear=this.value;save();syncSettingsToGarage();renderHero()"></label>
        <label>Make<input id="settingsCarMake" oninput="data.carMake=this.value;save();syncSettingsToGarage();renderHero()"></label>
        <label>Model<input id="settingsCarModelName" oninput="data.carModelName=this.value;save();syncSettingsToGarage();renderHero()"></label>
        <label>Chassis Code<input id="settingsChassisCode" oninput="data.chassisCode=this.value;save();syncSettingsToGarage();renderHero()" placeholder="FE1"></label>
        <label>Engine<input id="settingsEngineCode" oninput="data.engineCode=this.value;save();syncSettingsToGarage();renderHero()" placeholder="1.5T"></label>
        <label>Purchase Mileage<input id="settingsPurchaseMileage" inputmode="numeric" oninput="data.purchaseMileage=this.value;save();renderTimeline()" placeholder="31987"></label>
        <label class="span2">Accent Color
          <div class="color-row">
            <input id="settingsAccentColor" type="color" oninput="data.accentColor=this.value;save();syncSettingsToGarage();renderHero()">
            <span>Live theme color</span>
          </div>
        </label>
        <label class="span2">Background Photo
          <div class="bg-control-row">
            <button class="btn" type="button" onclick="openBackgroundPicker()">Change Background Photo</button>
            <button class="btn" type="button" onclick="useHeroAsBackground()">Use Hero</button>
            <button class="btn danger" type="button" onclick="clearBackground()">Reset</button>
          </div>
          <input id="bgPhotoInput" type="file" accept="image/png,image/jpeg,image/webp,image/*" onchange="handleBackgroundFile(event)">
        </label>
        <label class="span2">Background URL<input id="backgroundImage" oninput="data.backgroundImage=this.value;save();syncSettingsToGarage();renderHero()" placeholder="optional direct image link"></label>
        <label class="span2">Background Opacity / Visibility
          <input id="backgroundOpacity" type="range" min="0.25" max="1" step="0.01" oninput="data.backgroundOpacity=this.value;save();syncSettingsToGarage();renderHero()">
        </label>
      </div>
      <div class="actions" style="justify-content:flex-start;margin-top:16px">
        <button class="btn" onclick="exportData()">Export Backup</button>
        <button class="btn" onclick="document.getElementById('importFile').click()">Import Backup</button>
        <button class="btn danger" onclick="resetToSkeleton()">Reset to Skeleton</button>
        <button class="btn danger" onclick="resetAll()">Full Reset</button>
        <input id="importFile" class="hidden" type="file" accept="application/json" onchange="importData(event)">
      </div>
    </section>
  </main>
</div>
</div>

<nav class="bottom-tabs">

let data={

  ]
};

let sortPrefs = {};

function migrate(old){
  if(!old)return;
  data = {...data, ...old};
  if(!Array.isArray(data.mods))data.mods=[];
  if(!Array.isArray(data.services))data.services=[];
  if(!data.purchaseMileage) data.purchaseMileage = "31987";
  if(!data.carYear) data.carYear = "2022";
  if(!data.carMake) data.carMake = "Honda";
  if(!data.carModelName) data.carModelName = "Civic Si";
  if(!data.accentColor) data.accentColor = "#ff3b3b";
  if(!data.chassisCode) data.chassisCode = "FE1";
  if(!data.engineCode) data.engineCode = "1.5T";
  if(!data.backgroundOpacity) data.backgroundOpacity = "0.65";
  if(!("backgroundImage" in data)) data.backgroundImage = "";
}
function load(){
  try{
    const v3=localStorage.getItem(KEY);
    const v2=localStorage.getItem("clifford_build_log_v2");
    const v1=localStorage.getItem("clifford_build_log_v1");
    if(v3)migrate(JSON.parse(v3));
    else if(v2)migrate(JSON.parse(v2));
    else if(v1)migrate(JSON.parse(v1));
  }catch(e){}
}
function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
  scheduleCloudSave();
}
function money(v){const n=parseFloat(v);return isNaN(n)?"$0.00":n.toLocaleString(undefined,{style:"currency",currency:"USD"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function imgFor(m){return m.image&&m.image.trim()?m.image.trim():fallbackImg}

function updateOwnedTime(){
  const el = document.getElementById("ownedTime");
  if(!el) return;

  const now = new Date();
  let diff = Math.max(0, now - OWNED_DATE);
  const daysTotal = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);

  el.innerHTML = `${ownedMonthsDays()}<br><span style="color:var(--muted);font-size:.9rem">${daysTotal} days • ${hours} hr • ${mins} min</span>`;
}

function renderHero(){
  if(!data.carYear) data.carYear = "2022";
  if(!data.carMake) data.carMake = "Honda";
  if(!data.carModelName) data.carModelName = "Civic Si";
  if(!data.accentColor) data.accentColor = "#ff3b3b";
  if(!data.chassisCode) data.chassisCode = "FE1";
  if(!data.engineCode) data.engineCode = "1.5T";
  if(!data.backgroundOpacity) data.backgroundOpacity = "0.65";

  data.carModel = `${data.carYear} ${data.carMake} ${data.carModelName}`.trim();
  document.documentElement.style.setProperty("--accent", data.accentColor);
  document.documentElement.style.setProperty("--bg-opacity", data.backgroundOpacity || "0.65");
  const bg = data.backgroundImage && data.backgroundImage.trim()
    ? `url("${data.backgroundImage}")`
    : `url("https://tailofthedragon.com/wp-content/uploads/2025/06/TODInfoTopFeaturedMaybe.jpg")`;
  document.documentElement.style.setProperty("--custom-bg", bg);

  carNameHero.textContent=data.carName||"Clifford";
  carModelHero.textContent=data.carModel||"2022 Honda Civic Si";
  heroImg.src=data.carImage||fallbackImg;
  const chassis = document.getElementById("chassisTag");
  const engine = document.getElementById("engineTag");
  if(chassis) chassis.textContent = data.chassisCode || "FE1";
  if(engine) engine.textContent = data.engineCode || "1.5T";

  ["carName","carModel","carImage","goals","carYear","carMake","carModelName","accentColor","chassisCode","engineCode","backgroundImage","backgroundOpacity"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.value=data[id]||"";
  });
}
function sortedItemsForCategory(cat){
  const pref = sortPrefs[cat] || "default";
  const items = data.mods.map((m,i)=>({m,i})).filter(x=>(x.m.category||"Uncategorized")===cat);

  if(pref === "priceHigh") items.sort((a,b)=>(parseFloat(b.m.price)||0)-(parseFloat(a.m.price)||0));
  if(pref === "priceLow") items.sort((a,b)=>(parseFloat(a.m.price)||0)-(parseFloat(b.m.price)||0));
  if(pref === "dateAsc") items.sort((a,b)=>(a.m.date||"9999-99-99").localeCompare(b.m.date||"9999-99-99"));
  if(pref === "dateDesc") items.sort((a,b)=>(b.m.date||"0000-00-00").localeCompare(a.m.date||"0000-00-00"));

  return items;
}
function setSort(cat,val){
  sortPrefs[cat]=val;
  renderMods();
}
function categoryPlannedTotal(cat){
  return data.mods
    .filter(m=>(m.category||"Uncategorized")===cat && m.status==="Planned")
    .reduce((a,m)=>a+(parseFloat(m.price)||0),0);
}
function renderMods(){
  const baseCats=["Cosmetics","Performance","Handling"];
  const cats=[...new Set([...baseCats, ...data.mods.map(m=>m.category||"Uncategorized")])];
  modsPage.innerHTML=cats.map(cat=>{
    const planned = categoryPlannedTotal(cat);
    const selected = sortPrefs[cat] || "default";
    return `<section class="section">
      <div class="section-head">
        <h2>${esc(cat)}</h2>
        <div class="section-controls">
          <select class="sort-select" onchange="setSort('${esc(cat)}',this.value)">
            <option value="default" ${selected==="default"?"selected":""}>Sort By</option>
            <option value="priceHigh" ${selected==="priceHigh"?"selected":""}>Price High → Low</option>
            <option value="priceLow" ${selected==="priceLow"?"selected":""}>Price Low → High</option>
            <option value="dateAsc" ${selected==="dateAsc"?"selected":""}>Install Date ↑</option>
            <option value="dateDesc" ${selected==="dateDesc"?"selected":""}>Install Date ↓</option>
          </select>
          <button class="btn red" onclick="addMod('${esc(cat)}')">＋ Add Item</button>
        </div>
      </div>
      ${planned>0?`<div class="planned-line">Planned in this category: <b>${money(planned)}</b></div>`:""}
      ${sortedItemsForCategory(cat).length
        ? sortedItemsForCategory(cat).map(({m,i})=>itemHTML(m,i)).join("")
        : `<div class="empty-cat" onclick="addMod('${esc(cat)}')">
            <div class="empty-thumb">N/A</div>
            <div>
              <h3>N/A Placeholder</h3>
              <p>Tap to add first item</p>
            </div>
          </div>`}
    </section>`;
  }).join("");
  initSwipe();
}
function itemHTML(m,i){
  return `<div class="swipe-wrap" data-type="mod" data-index="${i}">
    <div class="delete-bg" onclick="deleteMod(${i})">Delete</div>
    <div class="item swipe-target" onclick="toggleEditor(${i})">
      <img class="thumb" src="${esc(imgFor(m))}" onerror="this.src=fallbackImg" onclick="event.stopPropagation(); const el=document.getElementById('modPhoto-${i}'); if(el) el.click();" title="Tap to change photo">
      <div class="info"><h3>${esc(m.name||"New Item")}</h3><div class="meta"><span class="pill">${esc(m.brand||"No brand")}</span><span class="pill">${esc(m.status||"Planned")}</span></div></div>
      <div class="price">${money(m.price)}</div><div class="chev">›</div>
      <div class="editor" id="editor-${i}" onclick="event.stopPropagation()">
        <div class="form">
          <label>Category<input value="${esc(m.category)}" oninput="data.mods[${i}].category=this.value;save()"></label>
          <label class="span2">Name<input value="${esc(m.name)}" oninput="data.mods[${i}].name=this.value;save()"></label>
          <label>Price<input type="number" value="${esc(m.price)}" oninput="data.mods[${i}].price=this.value;save();renderTotals()"></label>

function formatDate(d){
  try{return new Date(d+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}catch(e){return d}
}
function ownedMonthsDays(){
  const now = new Date();
  let years = now.getFullYear() - OWNED_DATE.getFullYear();
  let months = now.getMonth() - OWNED_DATE.getMonth();
  let days = now.getDate() - OWNED_DATE.getDate();

  if(days < 0){
    const prevMonthDays = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    days += prevMonthDays;
    months--;
  }
  if(months < 0){
    months += 12;
    years--;
  }

  const parts = [];
  if(years > 0) parts.push(`${years} yr${years === 1 ? "" : "s"}`);
  if(months > 0) parts.push(`${months} month${months === 1 ? "" : "s"}`);
  parts.push(`${days} day${days === 1 ? "" : "s"}`);
  return parts.join(" ");
}

function initSwipe(){
  document.querySelectorAll(".swipe-wrap").forEach(wrap=>{
    const target=wrap.querySelector(".swipe-target");
    if(!target || target.dataset.swipeReady)return;
    target.dataset.swipeReady="1";
    let startX=0,startY=0,dx=0,dragging=false;
    target.addEventListener("pointerdown",e=>{
      if(e.target.closest("input,textarea,select,button"))return;
      startX=e.clientX; startY=e.clientY; dx=0; dragging=true;
      target.setPointerCapture(e.pointerId);
    });
    target.addEventListener("pointermove",e=>{
      if(!dragging)return;
      dx=e.clientX-startX;
      const dy=Math.abs(e.clientY-startY);
      if(dy>35)return;
      if(dx<0){
        target.style.transform=`translateX(${Math.max(dx,-112)}px)`;
      }
    });
    target.addEventListener("pointerup",e=>{
      if(!dragging)return;
      dragging=false;
      target.style.transform="";
      if(dx<-55){
        target.classList.add("swiped");
        wrap.classList.add("show-delete");
      } else if(dx>25){
        target.classList.remove("swiped");
        wrap.classList.remove("show-delete");
      } else if(!target.classList.contains("swiped")){
        wrap.classList.remove("show-delete");
      }
    });
  });
}







function setCloudStatus(text){
  const el=document.getElementById("cloudStatus");
  if(el) el.textContent=text;
}

async function initCloud(){
  if(!window.supabase){
    setCloudStatus("Cloud library blocked. Local mode.");
    return;
  }

  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  });

  const { data: sessionData } = await supabaseClient.auth.getSession();
  cloudUser = sessionData && sessionData.session ? sessionData.session.user : null;

  updateCloudUI();

  supabaseClient.auth.onAuthStateChange(async (event, session)=>{
    cloudUser = session ? session.user : null;
    updateCloudUI();

    if(event === "SIGNED_IN"){
      await cloudLoad(true);
    }
  });

  if(cloudUser){
    await cloudLoad(true);
  }
}

function updateCloudUI(){
  const authBox=document.getElementById("authBox");
  if(authBox) authBox.style.display = cloudUser ? "none" : "grid";

  if(cloudUser){
    setCloudStatus(`Signed in: ${cloudUser.email}`);
  }else{
    setCloudStatus("Local mode. Log in to sync.");
  }
}

async function cloudSignUp(){
  if(!supabaseClient) return setCloudStatus("Cloud not ready.");
  const email=document.getElementById("authEmail")?.value?.trim();
  const password=document.getElementById("authPassword")?.value || "";

  if(!email || password.length < 6){
    alert("Use an email and a password with at least 6 characters.");
    return;
  }

  setCloudStatus("Creating account...");
  const { data: signData, error } = await supabaseClient.auth.signUp({ email, password });

  if(error){
    alert(error.message);
    updateCloudUI();
    return;
  }

  cloudUser = signData.user || cloudUser;
  updateCloudUI();

  if(signData.session){
    await cloudSaveNow();
  }else{
    setCloudStatus("Check your email to confirm, then log in.");
  }
}

async function cloudSignIn(){
  if(!supabaseClient) return setCloudStatus("Cloud not ready.");
  const email=document.getElementById("authEmail")?.value?.trim();
  const password=document.getElementById("authPassword")?.value || "";

  if(!email || !password){
    alert("Enter your email and password.");
    return;
  }

  setCloudStatus("Logging in...");
  const { data: signData, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if(error){
    alert(error.message);
    updateCloudUI();
    return;
  }

  cloudUser = signData.user;
  updateCloudUI();
  await cloudLoad(true);
}

async function cloudSignOut(){
  if(!supabaseClient) return;
  await supabaseClient.auth.signOut();
  cloudUser=null;
  updateCloudUI();
}

function scheduleCloudSave(){
  if(isCloudLoading) return;
  if(!supabaseClient || !cloudUser) return;

  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(()=>cloudSaveNow(true),900);
}

async function cloudSaveNow(silent=false){
  if(!supabaseClient || !cloudUser){
    if(!silent) alert("Log in first.");
    return;
  }

  try{
    if(!silent) setCloudStatus("Saving to cloud...");

    const payload = {
      user_id: cloudUser.id,
      data: data,
      updated_at: new Date().toISOString()
    };

    const { error } = await supabaseClient
      .from("garage_data")
      .upsert(payload, { onConflict:"user_id" });

    if(error) throw error;

    setCloudStatus(`Cloud saved • ${new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})}`);
  }catch(err){
    console.error(err);
    setCloudStatus("Cloud save failed. Local changes are still saved.");
    if(!silent) alert(err.message || "Cloud save failed.");
  }
}

async function cloudLoad(auto=false){
  if(!supabaseClient || !cloudUser){
    if(!auto) alert("Log in first.");
    return;
  }

  try{
    setCloudStatus("Loading cloud data...");

    const { data: row, error } = await supabaseClient
      .from("garage_data")
      .select("data,updated_at")
      .eq("user_id", cloudUser.id)
      .maybeSingle();

    if(error) throw error;

    if(row && row.data && Object.keys(row.data).length){
      isCloudLoading=true;
      data = { ...data, ...row.data };
      localStorage.setItem(KEY, JSON.stringify(data));
      isCloudLoading=false;
      render();
      setCloudStatus(`Cloud loaded • ${new Date(row.updated_at).toLocaleString()}`);
    }else{
      setCloudStatus("No cloud data yet. Saving this garage...");
      await cloudSaveNow(true);
    }
  }catch(err){
    console.error(err);
    isCloudLoading=false;
    setCloudStatus("Cloud load failed. Local mode still works.");
    if(!auto) alert(err.message || "Cloud load failed.");
  }
}

function handlePhotoFile(event, type, index=null){
  const input = event.target;
  const file = input.files && input.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){
    const rawDataUrl = e.target.result || "";
    const name = (file.name || "").toLowerCase();
    const mime = (file.type || "").toLowerCase();

    // iPhone sometimes gives weird/blank MIME types. Detect PNG multiple ways.
    const looksTransparentSafe =
      type === "hero" ||
      mime.includes("png") ||
      name.endsWith(".png") ||
      String(rawDataUrl).startsWith("data:image/png");

    const img = new Image();

    img.onload = function(){
      // Smaller max size avoids iPhone/localStorage choking on large transparent PNGs.
      const maxSide = type === "hero" ? 1200 : 900;
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;

      if(w > maxSide || h > maxSide){
        const ratio = Math.min(maxSide / w, maxSide / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }

      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d", {alpha:true});

      // Never flatten hero images. This keeps transparent PNGs transparent.
      ctx.clearRect(0,0,w,h);

      // Only non-hero/non-transparent images get a black backing.
      if(!looksTransparentSafe){
        ctx.fillStyle = "#000";
        ctx.fillRect(0,0,w,h);
      }

      ctx.drawImage(img, 0, 0, w, h);

      // WebP keeps transparency and is way smaller than PNG on iPhone/Safari.
      let finalDataUrl = "";
      try{
        finalDataUrl = looksTransparentSafe ? canvas.toDataURL("image/webp", 0.92) : canvas.toDataURL("image/jpeg", 0.9);
        // Safari fallback if WebP export is unsupported.
        if(looksTransparentSafe && !finalDataUrl.startsWith("data:image/webp")){
          finalDataUrl = canvas.toDataURL("image/png");
        }
      }catch(err){
        finalDataUrl = looksTransparentSafe ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.9);
      }

      // If it is still huge, try a smaller transparent export.
      function trySave(dataUrl){
        if(type === "hero"){
          data.carImage = dataUrl;
        }else if(type === "mod" && data.mods[index]){
          data.mods[index].image = dataUrl;
        }
        save();
        render();
      }

      try{
        trySave(finalDataUrl);
      }catch(err){
        try{
          const small = document.createElement("canvas");
          const smallMax = type === "hero" ? 800 : 650;
          const ratio = Math.min(1, smallMax / w, smallMax / h);
          small.width = Math.round(w * ratio);
          small.height = Math.round(h * ratio);
          const sctx = small.getContext("2d", {alpha:true});
          sctx.clearRect(0,0,small.width,small.height);
          if(!looksTransparentSafe){
            sctx.fillStyle = "#000";
            sctx.fillRect(0,0,small.width,small.height);
          }
          sctx.drawImage(img,0,0,small.width,small.height);

          let smallerDataUrl = looksTransparentSafe ? small.toDataURL("image/webp",0.86) : small.toDataURL("image/jpeg",0.86);
          if(looksTransparentSafe && !smallerDataUrl.startsWith("data:image/webp")){
            smallerDataUrl = small.toDataURL("image/png");
          }
          trySave(smallerDataUrl);
        }catch(err2){
          alert("That transparent PNG is too large to save inside this offline page. Try exporting it smaller, around 1000px wide.");
        }
      }

      input.value = "";
    };

    img.onerror = function(){
      // Direct raw fallback for PNGs that Safari refuses to decode through canvas.
      try{
        if(looksTransparentSafe){
          if(type === "hero"){
            data.carImage = rawDataUrl;
          }else if(type === "mod" && data.mods[index]){
            data.mods[index].image = rawDataUrl;
          }
          save();
          render();
        }else{
          alert("Could not load that image. Try PNG, JPEG, or WebP.");
        }
      }catch(err){
        alert("That image is too large to save. Try a smaller transparent PNG.");
      }
      input.value = "";
    };

    img.src = rawDataUrl;
  };

  reader.onerror = function(){
    alert("Could not read that photo. Try choosing it from Files instead of Photos, especially for transparent PNGs.");
  };

  reader.readAsDataURL(file);
}

function handleBackgroundFile(event){

      const maxSide = 1200;

        const ratio = Math.min(maxSide / w, maxSide / h);

      }

      ctx.fillStyle = "#050608";

          const small = document.createElement("canvas");
          const smallMax = 850;
          const ratio = Math.min(1, smallMax / w, smallMax / h);
          small.width = Math.round(w * ratio);
          small.height = Math.round(h * ratio);
          const sctx = small.getContext("2d", {alpha:false});
          sctx.fillStyle = "#050608";
          sctx.fillRect(0,0,small.width,small.height);
          sctx.drawImage(img,0,0,small.width,small.height);
          applyAndSave(small.toDataURL("image/jpeg",0.66));
        }catch(err2){
          alert("Your phone is blocking or storage-limiting this background image. Try opening the HTML in Safari, or use the Background URL field.");
        }
      }

      input.value = "";
    };

    img.onerror = function(){
      alert("Could not load that background image. Try a normal screenshot/photo or use the Background URL field.");
      input.value = "";
    };

    img.src = rawDataUrl;
  };

  reader.onerror = function(){
    alert("Your browser blocked reading the image. Try opening the HTML in Safari or choose from Files instead of Photos.");
  };

  reader.readAsDataURL(file);
}
